<g><title>optional: lemon juice, coriander</title><rect x="12" y="792" width="162" height="32" rx="4" fill="#f2f5f7" stroke="#bbc7cf"/><text x="20" y="813" font-size="14" font-weight="650">Coriander (optional)</text></g>
<rect x="223" y="116" width="247" height="54" rx="4" fill="#f7f7f2" stroke="#c4cbc4"/>
<text x="231" y="132" font-size="12" font-weight="700">Preparation</text>
<text x="231" y="148" font-size="13" font-weight="400">Rinse lentils and simmer until</text>
<text x="231" y="163" font-size="13" font-weight="400">fully tender.</text>
<rect x="223" y="175" width="247" height="69" rx="4" fill="#f7f7f2" stroke="#c4cbc4"/>
<text x="231" y="191" font-size="12" font-weight="700">Synergy</text>
<text x="231" y="207" font-size="13" font-weight="400">Vitamin C in lemon juice may</text>
<text x="231" y="222" font-size="13" font-weight="400">support absorption of non-haem</text>
<text x="231" y="237" font-size="13" font-weight="400">iron from lentils.</text>
<rect x="223" y="350" width="247" height="54" rx="4" fill="#f7f7f2" stroke="#c4cbc4"/>
<text x="231" y="366" font-size="12" font-weight="700">Preparation</text>
<text x="231" y="382" font-size="13" font-weight="400">Bloom turmeric, ginger and cumin</text>
<text x="231" y="397" font-size="13" font-weight="400">briefly in oil. Avoid scorching.</text>
<rect x="223" y="477" width="247" height="54" rx="4" fill="#f7f7f2" stroke="#c4cbc4"/>
<text x="231" y="493" font-size="12" font-weight="700">Preparation</text>
<text x="231" y="509" font-size="13" font-weight="400">Add spinach near the end and wilt</text>
<text x="231" y="524" font-size="13" font-weight="400">briefly.</text>
<rect x="223" y="536" width="247" height="54" rx="4" fill="#f7f7f2" stroke="#c4cbc4"/>
<text x="231" y="552" font-size="12" font-weight="700">Synergy</text>
<text x="231" y="568" font-size="13" font-weight="400">Oil in the meal may support</text>
<text x="231" y="583" font-size="13" font-weight="400">absorption of spinach carotenoids.</text>
<rect x="223" y="747" width="247" height="54" rx="4" fill="#f7f7f2" stroke="#c4cbc4"/>
<text x="231" y="763" font-size="12" font-weight="700">Preparation</text>
<text x="231" y="779" font-size="13" font-weight="400">Finish with optional lemon juice</text>
<text x="231" y="794" font-size="13" font-weight="400">at serving.</text>
