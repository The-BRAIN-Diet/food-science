<g><title>1 cup (30 g) spinach</title><rect x="12" y="451" width="162" height="32" rx="4" fill="#f2f5f7" stroke="#bbc7cf"/><text x="20" y="472" font-size="14" font-weight="650">Spinach</text></g>
