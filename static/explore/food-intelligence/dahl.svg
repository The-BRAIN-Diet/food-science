<g><title>1 cup (192 g) dry red lentils</title><rect x="12" y="90" width="162" height="32" rx="4" fill="#f2f5f7" stroke="#bbc7cf"/><text x="20" y="111" font-size="14" font-weight="650">Lentils</text></g>
