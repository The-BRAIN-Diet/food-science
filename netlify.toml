# Resolve the reviewed SEC baseline even when Netlify uses a shallow checkout.
[build]
  command = 'git fetch --no-tags origin "$SEC_BASE_REF" && npm run build'

# Preserve the validated heap limit and protect the reviewed 84-snapshot history.
[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"
  SEC_BASE_REF = "ebbc10ed11484192c972952d8c47645bd3c5bf4e"
  # Cap JavaScript minifier workers without disabling minification.
  TERSER_PARALLEL = "1"
  # Match the validated local production build; avoid filesystem cache retention/serialization.
  DOCUSAURUS_NO_PERSISTENT_CACHE = "1"

# HTTP 301s. These are server redirects, not Docusaurus meta-refresh pages.
# Recipe source folders stay capitalised. Public URLs are the lowercase slugs.
# The moved roe shot must be matched before the general Drinks rule.

[[redirects]]
  from = "/docs/recipes/Drinks/neuroeshot-roe"
  to = "/docs/recipes/snacks/neuroeshot-roe/"
  status = 301
  force = true

[[redirects]]
  from = "/docs/recipes/Drinks/neuroeshot-roe/"
  to = "/docs/recipes/snacks/neuroeshot-roe/"
  status = 301
  force = true

